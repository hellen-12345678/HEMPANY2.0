<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMPANY - Mini Tienda Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>HEMPANY - Mini Tienda</h1>
    </header>

    <nav>
        <a href="#" onclick="showForm('login-form'); return false;">Iniciar Sesión</a>
        <a href="#" onclick="showForm('register-form'); return false;">Registrarse</a>
        <a href="#" onclick="logout(); return false;">Cerrar Sesión</a>
    </nav>

    <div class="container">
        <div id="login-form" class="form-container">
            <h2>Iniciar Sesión</h2>
            <input type="text" id="login-username" placeholder="Usuario">
            <input type="password" id="login-password" placeholder="Contraseña">
            <button onclick="login()">Iniciar Sesión</button>
        </div>

        <div id="register-form" class="form-container">
            <h2>Registrarse</h2>
            <input type="text" id="register-username" placeholder="Usuario">
            <input type="password" id="register-password" placeholder="Contraseña">
            <button onclick="register()">Registrarse</button>
        </div>

        <div id="product-list">
            <!-- Productos generados con JS -->
        </div>

        <div id="inventory" style="display:none;">
            <h2>Inventario del Día</h2>
            <table id="inventory-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad Vendida</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="total-sold"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Hempany</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
